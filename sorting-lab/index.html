<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>排序演算法 3D 實驗室</title>
<meta name="description" content="用立體長條動畫一步一步觀察七種排序演算法，並同步對照 Python、C、Java 程式碼。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: algorithm rail across the top → [3D stage + narration + transport | code + theory], one column under 1060px */
:root{
  --bg:#E7EBF2; --surface:#F8FAFD; --surface-2:#EEF2F8; --ink:#141B2D; --muted:#59647A; --line:#D1D8E4;
  --accent:#2C54D6; --accent-ink:#FFFFFF;
  --cmp:#E7A400; --swap:#EC4A35; --pivot:#C23AD9; --done:#1FA85B;
  --stage-a:#D9E0EC; --stage-b:#F4F7FB; --floor:#CBD3E1; --tile:#B6C1D4; --tile-range:#9DB0E8;
  --code-bg:#F3F6FA; --code-hot:#FFF0B8; --code-hot-bar:#E7A400;
  --tok-kw:#A8237A; --tok-fn:#2145B5; --tok-num:#B04F08; --tok-str:#2D7A31; --tok-com:#7A8497;
  --font-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121C; --surface:#141B28; --surface-2:#1A2232; --ink:#E4E9F3; --muted:#8D98AD; --line:#263043;
    --accent:#7F9BFF; --accent-ink:#0D121C;
    --cmp:#FFC23A; --swap:#FF6A55; --pivot:#E072F4; --done:#3CD58A;
    --stage-a:#090D15; --stage-b:#18202F; --floor:#1C2434; --tile:#2A3447; --tile-range:#34488A;
    --code-bg:#10161F; --code-hot:#3A3115; --code-hot-bar:#FFC23A;
    --tok-kw:#F28BC6; --tok-fn:#8FB0FF; --tok-num:#F3A75F; --tok-str:#8DD592; --tok-com:#68748A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121C; --surface:#141B28; --surface-2:#1A2232; --ink:#E4E9F3; --muted:#8D98AD; --line:#263043;
  --accent:#7F9BFF; --accent-ink:#0D121C;
  --cmp:#FFC23A; --swap:#FF6A55; --pivot:#E072F4; --done:#3CD58A;
  --stage-a:#090D15; --stage-b:#18202F; --floor:#1C2434; --tile:#2A3447; --tile-range:#34488A;
  --code-bg:#10161F; --code-hot:#3A3115; --code-hot-bar:#FFC23A;
  --tok-kw:#F28BC6; --tok-fn:#8FB0FF; --tok-num:#F3A75F; --tok-str:#8DD592; --tok-com:#68748A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 32px;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.top > *{min-width:0}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 28px}
.brand{display:grid;gap:2px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--accent);font-weight:800}
.algos{display:flex;gap:0;overflow-x:auto;max-width:100%;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.algo-tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:6px 14px 8px;cursor:pointer;display:grid;gap:0;text-align:left;color:var(--muted);transition:color .15s,border-color .15s}
.algo-tab .zh{font-weight:700;font-size:15px;line-height:1.3}
.algo-tab .en{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;opacity:.85}
.algo-tab:hover{color:var(--ink)}
.algo-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.algo-tab[aria-selected="true"] .en{color:var(--accent);opacity:1}

/* ---------- main grid ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(360px,62vh,740px);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 18%,var(--stage-b) 0%,var(--stage-a) 70%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage.editable canvas.on-bar{cursor:ns-resize}
.hud{position:absolute;pointer-events:none;display:flex;gap:8px}
.hud > *{pointer-events:auto}
.chip{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:10px;padding:8px 12px}
.hud-tl{top:12px;left:12px;flex-direction:column;align-items:flex-start}
.hud-title{display:grid;gap:0}
.hud-title .zh{font-weight:900;font-size:19px;line-height:1.25}
.hud-title .en{font-family:var(--font-display);font-size:12.5px;color:var(--muted);font-weight:500}
.hud-tr{top:12px;right:12px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.stat{display:grid;gap:0;text-align:right;min-width:64px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.info .v{font-family:var(--font-mono);font-size:15px;font-weight:600;line-height:1.6;color:var(--accent)}
.hud-bl{left:12px;bottom:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hud-br{right:12px;bottom:12px}
.heapbox{padding:8px 10px 6px}
.heapbox .cap{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.heapbox svg{display:block}
.heapbox line{stroke:var(--line);stroke-width:1.5}
.heapbox circle{fill:var(--surface-2);stroke:var(--muted);stroke-width:1}
.heapbox text{font-family:var(--font-mono);font-size:9px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.heapbox .n-out circle{fill:var(--done);stroke:none;opacity:.55}
.heapbox .n-cmp circle{fill:var(--cmp);stroke:none}
.heapbox .n-mv circle{fill:var(--swap);stroke:none}
.heapbox .n-piv circle{fill:var(--pivot);stroke:none}
.heapbox .n-cmp text,.heapbox .n-mv text,.heapbox .n-piv text{fill:#fff;font-weight:600}
@media (max-width:760px){.hud-br{display:none}.hud-tr .stat.info{display:none}}
.tip{position:absolute;pointer-events:none;font-family:var(--font-mono);font-size:12.5px;padding:5px 9px;border-radius:7px;background:var(--ink);color:var(--surface);white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:3}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

/* ---------- narration + array strip ---------- */
.narr{padding:12px 16px;display:grid;gap:10px}
.narr-row{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.narr-step{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.narr-text{font-size:16px;font-weight:500;min-width:0;flex:1 1 280px}
.strips{display:grid;gap:6px}
.strip{display:flex;align-items:stretch;gap:3px;min-width:0}
.strip .lab{flex:none;width:38px;font-family:var(--font-mono);font-size:11px;color:var(--muted);align-self:center}
.cells{display:flex;gap:3px;flex:1;min-width:0}
.cell{flex:1 1 0;min-width:0;height:30px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;overflow:hidden;transition:background-color .12s,color .12s,border-color .12s}
.cells.dense .cell{height:16px;font-size:0;border-radius:3px}
.cell.range{border-color:var(--accent)}
.cell.done{background:color-mix(in srgb,var(--done) 26%,var(--surface-2));border-color:color-mix(in srgb,var(--done) 60%,transparent)}
.cell.cmp{background:var(--cmp);color:#1b1400;border-color:transparent;font-weight:600}
.cell.mv{background:var(--swap);color:#fff;border-color:transparent;font-weight:600}
.cell.piv{background:var(--pivot);color:#fff;border-color:transparent;font-weight:600}
.cell.empty{background:transparent;border-style:dashed}
.keychip{flex:none;font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:5px;background:var(--accent);color:var(--accent-ink);align-self:center;margin-left:6px}

/* ---------- transport ---------- */
.transport{padding:12px 14px;display:grid;gap:12px}
.t-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.btns{display:flex;gap:6px;align-items:center}
.btn{height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13.5px;transition:background-color .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{width:54px;height:44px;background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:12px}
.btn.play svg{width:20px;height:20px}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));border-color:var(--accent)}
.timeline{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:10px}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field input[type=range]{width:120px}
.field output{font-family:var(--font-mono);color:var(--ink);min-width:44px;font-variant-numeric:tabular-nums}
.data-row{border-top:1px solid var(--line);padding-top:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.pill[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:transparent}
.custom{display:flex;gap:6px;flex:1 1 260px;min-width:0}
.custom input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 10px;font-family:var(--font-mono);font-size:12.5px}
.custom .btn{height:34px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--ink)}
.err{color:var(--swap);font-size:12.5px;margin:0}

/* ---------- code panel ---------- */
.code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0 14px;flex-wrap:wrap}
.code-head h2,.theory h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.langs button{border:0;background:none;border-radius:7px;padding:4px 12px;cursor:pointer;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.langs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.code-tools{display:flex;gap:8px;align-items:center}
.btn.small{height:30px;font-size:12.5px;padding:0 10px}
.code{position:relative;margin:10px 0 0;background:var(--code-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-height:min(520px,58vh);overflow:auto;font-family:var(--font-mono);font-size:12.8px;line-height:1.62;padding:8px 0;tab-size:4}
@media (max-width:1060px){.code{max-height:none}}
.ln{display:flex;white-space:pre;padding-right:16px;min-width:max-content;border-left:3px solid transparent;transition:background-color .18s}
.ln .no{flex:none;width:38px;text-align:right;padding-right:14px;color:var(--tok-com);user-select:none;opacity:.8}
.ln.hot{background:var(--code-hot);border-left-color:var(--code-hot-bar)}
.ln.hot .no{color:var(--ink);opacity:1;font-weight:600}
.t-kw{color:var(--tok-kw);font-weight:600}.t-fn{color:var(--tok-fn)}.t-num{color:var(--tok-num)}.t-str{color:var(--tok-str)}.t-com{color:var(--tok-com);font-style:italic}
.run{padding:10px 14px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.run code{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;overflow-wrap:anywhere}

/* ---------- theory ---------- */
.theory{padding:14px 16px 16px;display:grid;gap:12px}
.idea{margin:0;font-size:15px;max-width:62ch}
.cx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cx div{padding:8px 10px;display:grid;gap:0;border-right:1px solid var(--line);min-width:0}
.cx div:last-child{border-right:0}
.cx .k{font-size:11px;color:var(--muted)}
.cx .v{font-family:var(--font-mono);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:460px){.cx{grid-template-columns:repeat(3,minmax(0,1fr))}.cx div:nth-child(3){border-right:0}.cx div:nth-child(-n+3){border-bottom:1px solid var(--line)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.steps-note{margin:0;font-size:13px;color:var(--muted);max-width:62ch}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Sorting Lab · 3D</span>
      <h1>排序演算法 <b>3D</b> 實驗室</h1>
    </div>
    <nav class="algos" id="algos" role="tablist" aria-label="選擇排序演算法"></nav>
  </header>

  <main class="grid">
    <section class="col" aria-label="動畫區">
      <div class="stage" id="stage">
        <div class="hud hud-tl">
          <div class="chip hud-title"><span class="zh" id="hudZh">泡沫排序</span><span class="en" id="hudEn">Bubble Sort</span></div>
        </div>
        <div class="hud hud-tr">
          <div class="chip stat"><span class="k">比較</span><span class="v" id="stCmp">0</span></div>
          <div class="chip stat"><span class="k">交換／搬移</span><span class="v" id="stWr">0</span></div>
          <div class="chip stat info" id="stInfoBox" hidden><span class="k" id="stInfoK">狀態</span><span class="v" id="stInfo">—</span></div>
        </div>
        <div class="hud hud-bl">
          <div class="chip seg" role="group" aria-label="視角">
            <button type="button" id="vFront" data-view="front" aria-pressed="false">正面</button>
            <button type="button" id="vAngle" data-view="angle" aria-pressed="true">斜視</button>
            <button type="button" id="vTop" data-view="top" aria-pressed="false">俯視</button>
          </div>
          <div class="chip seg"><button type="button" id="spinBtn" aria-pressed="false">自動旋轉</button></div>
        </div>
        <div class="hud hud-br"><div class="chip heapbox" id="heapBox" hidden><div class="cap">堆積樹狀圖（陣列 = 完全二元樹）</div><svg id="heapSvg" width="250" height="140" aria-hidden="true"></svg></div></div>
        <div class="tip" id="tip" hidden></div>
      </div>

      <div class="panel narr">
        <div class="narr-row">
          <span class="narr-step" id="stepLbl">步驟 0 / 0</span>
          <span class="narr-text" id="narr" aria-live="polite">載入中…</span>
        </div>
        <div class="strips">
          <div class="strip"><span class="lab">a[ ]</span><div class="cells" id="cellsA"></div><span class="keychip" id="keyChip" hidden></span></div>
          <div class="strip" id="tmpStrip" hidden><span class="lab">tmp</span><div class="cells" id="cellsT"></div></div>
        </div>
      </div>

      <div class="panel transport">
        <div class="t-row">
          <div class="btns">
            <button class="btn" type="button" id="bFirst" aria-label="回到開頭" title="回到開頭"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
            <button class="btn" type="button" id="bPrev" aria-label="上一步" title="上一步 (←)"><svg viewBox="0 0 24 24"><path d="M15.5 5v14L5 12z"/><path d="M17 5h2v14h-2z"/></svg></button>
            <button class="btn play" type="button" id="bPlay" aria-label="播放" title="播放／暫停 (空白鍵)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15L19.5 12z"/></svg></button>
            <button class="btn" type="button" id="bNext" aria-label="下一步" title="下一步 (→)"><svg viewBox="0 0 24 24"><path d="M8.5 5v14L19 12z"/><path d="M5 5h2v14H5z"/></svg></button>
            <button class="btn" type="button" id="bLast" aria-label="跳到結果" title="跳到結果"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
          </div>
          <div class="timeline"><input type="range" id="timeline" min="0" max="0" value="0" aria-label="時間軸"></div>
          <div class="field"><label for="speed">速度</label><input type="range" id="speed" min="1" max="10" value="5"><output id="speedOut" for="speed">8 步/秒</output></div>
          <button class="btn" type="button" id="soundBtn" aria-pressed="false" title="比較與交換時發出音高"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.5 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg><span>音效</span></button>
        </div>
        <div class="t-row data-row">
          <div class="pills" role="group" aria-label="資料型態">
            <button type="button" class="pill" data-kind="random" aria-pressed="true">隨機</button>
            <button type="button" class="pill" data-kind="nearly" aria-pressed="false">幾乎排好</button>
            <button type="button" class="pill" data-kind="reversed" aria-pressed="false">完全反向</button>
            <button type="button" class="pill" data-kind="few" aria-pressed="false">大量重複</button>
          </div>
          <div class="field"><label for="size">數量</label><input type="range" id="size" min="4" max="64" value="16"><output id="sizeOut" for="size">16</output></div>

def bubble_sort(a):

    for i in range(n - 1):
        swapped = False
        for j in range(n - 1 - i):
            if a[j] > a[j + 1]:                    #@cmp

            if (a[j] > a[j + 1]) {                 //@cmp

                a[j + 1] = t;                      //@swap

def selection_sort(a):

static void insertionSort(int[] a) {

shell:{
  zh:'希爾排序', en:'Shell Sort', cls:'ShellSort', file:'shell_sort',
  idea:'插入排序的加速版。先讓相隔 gap 的元素分組各自做插入排序，讓小的值快速跳到前面；再把 gap 減半重複，最後 gap = 1 時就是一般插入排序，但這時資料已經接近排好。',
  cx:{best:'O(n log n)',avg:'約 O(n^1.3)',worst:'O(n²)',space:'O(1)',stable:'不穩定'},
  call:{py:['shell_sort(data)'], c:['shell_sort(a, n);'], java:['shellSort(a);']},
  code:{
py:String.raw`
def shell_sort(a):
    n = len(a)
    gap = n // 2
    while gap > 0:                                 #@gap
        for i in range(gap, n):
            tmp = a[i]                             #@key
            j = i
            while j >= gap and a[j - gap] > tmp:   #@cmp
                a[j] = a[j - gap]                  #@shift
                j -= gap
            a[j] = tmp                             #@place
        gap //= 2
    return a`,
c:String.raw`
void shell_sort(int a[], int n) {
    for (int gap = n / 2; gap > 0; gap /= 2) {     //@gap
        for (int i = gap; i < n; i++) {
            int tmp = a[i];                        //@key
            int j = i;
            while (j >= gap && a[j - gap] > tmp) { //@cmp
                a[j] = a[j - gap];                 //@shift
                j -= gap;
            }
            a[j] = tmp;                            //@place
        }
    }
}`,
java:String.raw`
static void shellSort(int[] a) {
    int n = a.length;
    for (int gap = n / 2; gap > 0; gap /= 2) {     //@gap
        for (int i = gap; i < n; i++) {
            int tmp = a[i];                        //@key
            int j = i;
            while (j >= gap && a[j - gap] > tmp) { //@cmp
                a[j] = a[j - gap];                 //@shift
                j -= gap;
            }
            a[j] = tmp;                            //@place
        }
    }
}`},
  run(R){
    const n = R.n;
    for (let gap = n >> 1; gap > 0; gap >>= 1){
      R.info = `gap = ${gap}`; R.range = null;
      R.snap('gap', `間隔 gap = ${gap}：相隔 ${gap} 格的元素為同一組，各組做插入排序`);
      for (let i = gap; i < n; i++){
        const key = R.id(i), kv = R.val(key);
        R.lift(i);
        R.snap('key', `取出 tmp = a[${i}] = ${kv}`, {piv:key});
        let j = i;
        while (j >= gap){
          const x = R.v(j-gap), gt = x > kv;
          R.cmps++;
          R.snap('cmp', `比較 a[${j-gap}]=${x} 與 tmp=${kv}（相隔 ${gap}）：` + (gt ? '前者較大，往後跳' : '不用移動'), {cmp:[R.id(j-gap)], piv:key});
          if (!gt) break;
          R.move(j-gap, j);
          R.holdAt = j - gap;
          R.snap('shift', `把 ${x} 從 a[${j-gap}] 跳到 a[${j}]`, {mv:[R.id(j)], piv:key});
          j -= gap;
        }

        R.snap('place', `把 tmp=${kv} 放進 a[${j}]`, {mv:[key]});

merge:{
  zh:'合併排序', en:'Merge Sort', cls:'MergeSort', file:'merge_sort',
  idea:'分治法：把陣列一路對半切到只剩一個元素，再把兩段已排好的序列合併。合併時元素先複製到後排的暫存陣列 tmp，再依序取較小者放回。速度穩定，代價是需要額外 O(n) 空間。',
  cx:{best:'O(n log n)',avg:'O(n log n)',worst:'O(n log n)',space:'O(n)',stable:'穩定'},
  call:{py:['merge_sort(data)'], c:['int tmp[sizeof(a) / sizeof(a[0])];','merge_sort(a, tmp, 0, n - 1);'], java:['mergeSort(a, new int[a.length], 0, a.length - 1);']},
  code:{
py:String.raw`
def merge_sort(a, lo=0, hi=None, tmp=None):
    if hi is None:
        hi, tmp = len(a) - 1, a[:]
    if lo >= hi:
        return a
    mid = (lo + hi) // 2                   #@split
    merge_sort(a, lo, mid, tmp)
    merge_sort(a, mid + 1, hi, tmp)
    merge(a, tmp, lo, mid, hi)
    return a


def merge(a, tmp, lo, mid, hi):
    tmp[lo:hi + 1] = a[lo:hi + 1]          #@copy
    i, j = lo, mid + 1
    for k in range(lo, hi + 1):
        if i > mid:
            a[k] = tmp[j]                  #@restR
            j += 1
        elif j > hi:
            a[k] = tmp[i]                  #@restL
            i += 1
        elif tmp[i] <= tmp[j]:             #@cmp
            a[k] = tmp[i]                  #@takeL
            i += 1
        else:
            a[k] = tmp[j]                  #@takeR
            j += 1`,
c:String.raw`
void merge(int a[], int tmp[], int lo, int mid, int hi) {
    for (int k = lo; k <= hi; k++) tmp[k] = a[k];    //@copy
    int i = lo, j = mid + 1;
    for (int k = lo; k <= hi; k++) {
        if (i > mid)                a[k] = tmp[j++]; //@restR
        else if (j > hi)            a[k] = tmp[i++]; //@restL
        else if (tmp[i] <= tmp[j])  a[k] = tmp[i++]; //@cmp,takeL
        else                        a[k] = tmp[j++]; //@takeR
    }
}

void merge_sort(int a[], int tmp[], int lo, int hi) {
    if (lo >= hi) return;
    int mid = (lo + hi) / 2;                         //@split
    merge_sort(a, tmp, lo, mid);
    merge_sort(a, tmp, mid + 1, hi);
    merge(a, tmp, lo, mid, hi);
}`,
java:String.raw`
static void mergeSort(int[] a, int[] tmp, int lo, int hi) {
    if (lo >= hi) return;
    int mid = (lo + hi) / 2;                         //@split
    mergeSort(a, tmp, lo, mid);
    mergeSort(a, tmp, mid + 1, hi);
    merge(a, tmp, lo, mid, hi);
}

static void merge(int[] a, int[] tmp, int lo, int mid, int hi) {
    for (int k = lo; k <= hi; k++) tmp[k] = a[k];    //@copy
    int i = lo, j = mid + 1;
    for (int k = lo; k <= hi; k++) {
        if (i > mid)                a[k] = tmp[j++]; //@restR
        else if (j > hi)            a[k] = tmp[i++]; //@restL
        else if (tmp[i] <= tmp[j])  a[k] = tmp[i++]; //@cmp,takeL
        else                        a[k] = tmp[j++]; //@takeR
    }
}`},
  run(R){
    const n = R.n;
    const take = (src, k, tag, desc) => {
      R.slots[k] = R.aux[src]; R.aux[src] = -1; R.writes++;
      R.snap(tag, desc, {mv:[R.slots[k]]});
    };
    const merge = (lo, mid, hi) => {
      R.range = [lo, hi]; R.info = `[${lo}..${mid}] + [${mid+1}..${hi}]`;
      for (let k = lo; k <= hi; k++){ R.aux[k] = R.slots[k]; R.slots[k] = -1; }
      R.snap('copy', `合併 a[${lo}..${mid}] 與 a[${mid+1}..${hi}]：先整段複製到後排暫存 tmp`);
      let i = lo, j = mid + 1;
      for (let k = lo; k <= hi; k++){
        if (i > mid){ const v = R.val(R.aux[j]); take(j, k, 'restR', `左半已取完，把右半剩下的 ${v} 放回 a[${k}]`); j++; }
        else if (j > hi){ const v = R.val(R.aux[i]); take(i, k, 'restL', `右半已取完，把左半剩下的 ${v} 放回 a[${k}]`); i++; }
        else {
          const x = R.val(R.aux[i]), y = R.val(R.aux[j]);
          R.cmps++;
          R.snap('cmp', `比較左半 tmp[${i}]=${x} 與右半 tmp[${j}]=${y}`, {cmp:[R.aux[i], R.aux[j]]});
          if (x <= y){ take(i, k, 'takeL', `${x} ≤ ${y}，取左半的 ${x} 放入 a[${k}]`); i++; }
          else { take(j, k, 'takeR', `${y} < ${x}，取右半的 ${y} 放入 a[${k}]`); j++; }
        }
      }
      if (lo === 0 && hi === n - 1) for (let k = 0; k < n; k++) R.sorted.add(k);
      R.snap('merged', `a[${lo}..${hi}] 合併完成，這一段已排好`);
    };
    const ms = (lo, hi) => {
      if (lo >= hi) return;
      const mid = (lo + hi) >> 1;
      R.range = [lo, hi]; R.info = `[${lo}..${hi}]`;
      R.snap('split', `切分 a[${lo}..${hi}]，mid = ${mid}，先處理左半 [${lo}..${mid}]`);
      ms(lo, mid); ms(mid + 1, hi); merge(lo, mid, hi);
    };
    ms(0, n - 1);
  }
},

quick:{

/* ---------- 逐步紀錄器：所有演算法都只「搬動」元素，方便追蹤每根長條 ---------- */
class Rec {
  constructor(vals){
    this.vals = vals; this.n = vals.length;
    this.slots = vals.map((_, i) => i);
    this.aux = new Array(this.n).fill(-1);
    this.hold = -1; this.holdAt = 0;
    this.sorted = new Set(); this.range = null; this.info = '';
    this.cmps = 0; this.writes = 0; this.frames = [];
  }
  id(k){ return this.slots[k]; }
  val(id){ return this.vals[id]; }
  v(k){ return this.vals[this.slots[k]]; }
  snap(tag, desc, o = {}){
    this.frames.push({
      slots:this.slots.slice(), aux:this.aux.slice(), hold:this.hold, holdAt:this.holdAt,
      sorted:[...this.sorted], range:this.range ? this.range.slice() : null, info:this.info,
      tag, desc, cmps:this.cmps, writes:this.writes,
      cmp:o.cmp || [], mv:o.mv || [], piv:o.piv ?? -1
    });
  }
  cmp(i, j, tag, desc, o = {}){ this.cmps++; this.snap(tag, desc, Object.assign({cmp:[this.slots[i], this.slots[j]]}, o)); }
  swap(i, j, tag, desc, o = {}){
    const s = this.slots; [s[i], s[j]] = [s[j], s[i]]; this.writes++;
    this.snap(tag, desc, Object.assign({mv:[s[i], s[j]]}, o));
  }
  lift(k){ this.hold = this.slots[k]; this.holdAt = k; this.slots[k] = -1; }
  move(from, to){ this.slots[to] = this.slots[from]; this.slots[from] = -1; this.writes++; }
  drop(k){ this.slots[k] = this.hold; this.hold = -1; this.writes++; }
}

function buildFrames(key, vals){
  const R = new Rec(vals);
  R.snap('start', '初始陣列。按播放，或用 → 一步一步看');
  ALGOS[key].run(R);
  R.range = null; R.hold = -1; R.info = '完成';
  for (let k = 0; k < R.n; k++) R.sorted.add(k);
  R.snap('end', `排序完成！共比較 ${R.cmps} 次、交換／搬移 ${R.writes} 次`);
  return R.frames;
}

const DEMO = '38, 27, 43, 3, 9, 82, 10';
function compose(def, lang){
  const body = def.code[lang].replace(/^\n+/, '').replace(/\s+$/, '');
  const call = def.call[lang];
  if (lang === 'py') return `${body}\n\n\nif __name__ == "__main__":\n    data = [${DEMO}]\n    ${call.join('\n    ')}\n    print(data)`;
  if (lang === 'c') return `#include <stdio.h>\n\n${body}\n\nint main(void) {\n    int a[] = {${DEMO}};\n    int n = sizeof(a) / sizeof(a[0]);\n    ${call.join('\n    ')}\n    for (int i = 0; i < n; i++) printf("%d ", a[i]);\n    printf("\\n");\n    return 0;\n}`;
  const ind = body.split('\n').map(l => l ? '    ' + l : l).join('\n');
  return `public class ${def.cls} {\n${ind}\n\n    public static void main(String[] args) {\n        int[] a = {${DEMO}};\n        ${call.join('\n        ')}\n        System.out.println(java.util.Arrays.toString(a));\n    }\n}`;
}
function parseCode(src){
  const map = {};
  const lines = src.split('\n').map((ln, i) => {
    const m = ln.match(/\s*(?:#|\/\/)@([\w,]+)\s*$/);
    if (!m) return ln;
    m[1].split(',').forEach(t => (map[t] = map[t] || []).push(i));
    return ln.slice(0, m.index);
  });
  return { lines, map, text: lines.join('\n') };
}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function highlight(line, lang){
  const re = lang === 'py'
    ? /(#.*$)|("[^"]*"|'[^']*')|(\b\d+\b)|([A-Za-z_]\w*)|(\s+)|([\s\S])/g
    : /(\/\/.*$)|("(?:\\.|[^"\\])*")|(\b\d+\b)|([A-Za-z_]\w*)|(\s+)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(line))){
    if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]){
      const w = m[4];
      if (KW[lang].has(w)) out += `<span class="t-kw">${w}</span>`;
      else if (/^\s*\(/.test(line.slice(re.lastIndex))) out += `<span class="t-fn">${w}</span>`;
      else out += w;
    } else out += esc(m[0]);
  }
  return out;
}

function genData(kind, n){
  const base = Array.from({length:n}, (_, i) => Math.round(6 + i * (92 / Math.max(1, n - 1))));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  if (kind === 'reversed') return base.reverse();
  if (kind === 'nearly'){
    const a = base.slice(); const times = Math.max(1, Math.round(n / 8));
    for (let t = 0; t < times; t++){ const i = Math.floor(Math.random() * (n - 1)); const j = Math.min(n - 1, i + 1 + Math.floor(Math.random() * 2)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  if (kind === 'few'){ const pool = [18, 42, 66, 90]; return Array.from({length:n}, () => pool[Math.floor(Math.random() * pool.length)]); }
  return shuffle(base);
}

/* ---------- 每一步套用到 3D ---------- */
function tweenDur(){ return st.playing ? Math.max(0.06, Math.min(0.42, 0.9 / SPS[st.speed - 1])) : 0.36; }

  b.from.copy(b.mesh.position); b.to.set(x, y, z); b.t = 0; b.dur = dur;
  const dx = x - b.from.x;
  const mainRow = Math.abs(b.from.z) < 0.05 && Math.abs(z) < 0.05 && Math.abs(b.from.y) < 0.05 && y === 0;
  if (mainRow && Math.abs(dx) > 0.01){

/* ---------- 鏡頭 ---------- */
const cam = { userMoved:false, fly:null };
const VIEWS = { front:[0, 0.26, 1], angle:[0.62, 0.5, 0.82], top:[0, 1, 0.16] };
function fitDistance(){
  const W = spacing * st.n + 2.4;

function goView(name, instant){

  const d = fitDistance() * (name === 'top' ? 0.92 : 1);
  const v = new THREE.Vector3(...VIEWS[name]).normalize().multiplyScalar(d);
  const tgt = new THREE.Vector3(0, name === 'top' ? 0.8 : 2.6, 0);

/* ---------- 互動：滑過顯示數值、在第 0 步拖曳改值 ---------- */
const tip = $('#tip');
const ray = window.THREE ? new THREE.Raycaster() : null, ndc = window.THREE ? new THREE.Vector2() : null;
let drag = null, hoverId = -1;
const editable = () => st.idx === 0 && !st.playing;
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(bars.map(b => b.mesh), false)[0];

}
function showTip(e, id){
  const r = stage.getBoundingClientRect(), b = bars[id], v = st.vals[id];
  const name = b.where === 'tmp' ? `tmp[${b.slot}]` : b.where === 'key' ? 'key' : `a[${b.slot}]`;
  tip.textContent = `${name} = ${v}` + (editable() ? '　↕ 拖曳改值' : '');
  tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';

  if (!gl) return;

    if (e.target !== cv) return;

    if (drag){

      if (v !== st.vals[drag.id]){ st.vals[drag.id] = v; setBarValue(bars[drag.id], v); uiDirty = true; renderStripValues(); }

/* =====================================================================
   7. 主迴圈
   ===================================================================== */
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let lastT = performance.now(), celebrate = -1;
function loop(now){

  if (st.playing){

    let guard = 0;
    while (st.acc >= 1 && st.idx < st.frames.length - 1 && guard++ < 8){
      st.acc -= 1; go(st.idx + 1, true);
    }
    if (st.idx >= st.frames.length - 1){
      st.playing = false; uiDirty = true;
      if (!reduceMotion) celebrate = now;
      fanfare();
    }
  }
  if (uiDirty){ uiDirty = false; renderUI(); }

  if (gl){
    const k = Math.min(1, dt * 14), kd = Math.min(1, dt * 6);
    const celeb = celebrate > 0 ? (now - celebrate) / 1000 : -1;
    if (celeb > 3) celebrate = -1;
    for (const b of bars){
      const p = b.mesh.position;
      if (b.t < 1){
        b.t = Math.min(1, b.t + dt / b.dur);
        const e = ease(b.t), s = Math.sin(Math.PI * e);
        p.set(b.from.x + (b.to.x - b.from.x) * e, b.from.y + (b.to.y - b.from.y) * e + s * b.arcH, b.from.z + (b.to.z - b.from.z) * e + s * b.arcZ);
      } else p.copy(b.to);
      if (celeb >= 0 && b.where === 'a'){
        const tt = celeb - b.slot * (1.1 / st.n);
        if (tt > 0 && tt < 0.42) p.y += Math.sin(tt / 0.42 * Math.PI) * 0.8;
      }
      b.hl += ((b.state ? 1 : 0) - b.hl) * k;
      b.done += (b.doneT - b.done) * kd;
      const m = b.mesh.material;
      m.color.copy(b.base).lerp(COL.done, b.done * 0.62);
      if (b.hl > 0.002){ m.color.lerp(b.stateCol, 0.7 * b.hl); m.emissive.copy(b.stateCol).multiplyScalar(0.42 * b.hl); }
      else m.emissive.setRGB(0, 0, 0);
      if (b.where === 'key' && !b.state){ m.emissive.copy(COL.pivot).multiplyScalar(0.25); }
      const sc = 1 + 0.14 * b.hl;
      b.mesh.scale.set(barW * sc, b.h, barD * sc);
      if (b.label) b.label.position.set(p.x, p.y + b.h + 0.42 * b.ls, p.z);
    }
    for (const t of tiles){
      const target = t.state === 'done' ? COL.done : t.state === 'range' ? COL['tile-range'] : COL.tile;
      t.cur.lerp(target, kd); t.mesh.material.color.copy(t.cur);
    }
    if (cam.fly){
      const F = cam.fly; F.t = Math.min(1, F.t + dt / 0.75); const e = ease(F.t);
      camera.position.lerpVectors(F.p0, F.p1, e); controls.target.lerpVectors(F.t0, F.t1, e);
      if (F.t >= 1) cam.fly = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

/* =====================================================================
   8. 啟動
   ===================================================================== */
initScene();
bindPointer();
st.vals = genData(st.kind, st.n);
renderTheory();
rebuild(true);
renderCode();
resize();
el.speedOut.textContent = `${SPS[st.speed - 1]} 步/秒`;
requestAnimationFrame(loop);
if (!reduceMotion) setTimeout(() => { if (st.idx === 0 && !st.playing) play(); }, 1200);
})();
</script>
