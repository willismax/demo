<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三民路 129 號</title>
<meta name="description" content="國立臺中科技大學三民校區、一中商圈與中友百貨的 3D 散步小遊戲。非官方作品，地圖為示意。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a full-screen three.js street scene; a 新生報到單 card opens and closes the day; HUD chips sit in the corners; dialogue slides up as a speech panel. */
:root{
  --ink:#1c2733; --muted:#5b6876; --paper:#fffdf8; --line:#e1dccf;
  --teal:#0f6e74; --orange:#f08a24; --red:#d6452f; --sky:#bfe6ff;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.chip{pointer-events:auto;background:rgba(255,253,248,.92);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.zone{font-size:14px}
.zone small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.hud-r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip b{color:var(--teal);font-variant-numeric:tabular-nums}
.chip.btn{background:var(--teal);color:#fff;border-color:var(--ink)}
.chip.btn.off{background:rgba(255,253,248,.92);color:var(--ink)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(28,39,51,.9);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#prompt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}
#prompt kbd{font:inherit;background:var(--ink);color:#fff;border-radius:4px;padding:0 6px;margin-right:6px;font-size:12px}

/* 手機操作 */
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:124px;height:124px;border-radius:50%;background:rgba(255,253,248,.35);border:2px solid rgba(28,39,51,.35);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,253,248,.9);border:2px solid var(--ink)}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:84px;height:84px;border-radius:50%;background:var(--orange);color:#fff;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:16px;font-weight:900}
#act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* 對話 */
#dlg{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.dlg-card{max-width:640px;margin:0 auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:14px 16px 12px;position:relative}
.dlg-name{position:absolute;top:-15px;left:14px;background:var(--teal);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 10px;font-size:13px;font-weight:900;letter-spacing:.04em}
.dlg-text{font-size:17px;line-height:1.7;min-height:3.4em;margin:6px 0 0;max-width:60ch}
.dlg-next{display:block;margin-left:auto;margin-top:4px;background:none;border:none;color:var(--muted);font-size:12px}
.choices{display:grid;gap:7px;margin-top:10px}
.choices button{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:500;box-shadow:0 2px 0 var(--ink);display:flex;justify-content:space-between;gap:10px}
.choices button span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.choices button[disabled]{opacity:.45;box-shadow:none}

/* 地圖 */
#mapWrap{position:fixed;inset:0;background:rgba(20,30,40,.55);display:grid;place-items:center;padding:16px}
.map-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:12px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.map-head h2{margin:0;font-size:17px;font-weight:900}
.map-head button{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:13px}
#map{width:100%;height:auto;aspect-ratio:290/255;max-height:70vh;border-radius:8px;border:1.5px solid var(--line);background:#e9efe2}
.map-note{font-size:12px;color:var(--muted);margin:0}

/* 開始與結束 */
.sheet{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(180deg,rgba(191,230,255,.55),rgba(191,230,255,.85));padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.card{max-width:520px;margin:0 auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:20px 20px 18px;display:grid;gap:12px;position:relative}
.form-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.form-head span{font-size:13px;font-weight:900;letter-spacing:.14em}
.form-head dl{margin:0;display:grid;grid-template-columns:auto auto;gap:0 8px;font-size:11.5px;color:var(--muted)}
.form-head dd{margin:0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:700;margin:0}
.title{font-size:clamp(40px,12vw,58px);font-weight:900;line-height:1.05;margin:0;letter-spacing:.01em}
.title em{font-style:normal;color:var(--orange)}
.lede{font-size:16px;line-height:1.7;margin:0}
.rows{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px;line-height:1.6}
.rows li{display:grid;grid-template-columns:5.5em 1fr;gap:8px}
.rows li b{color:var(--teal)}
.go{background:var(--orange);color:#fff;border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:13px;font-size:18px;font-weight:900;letter-spacing:.08em}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.go.ghost{background:#fff;color:var(--ink)}
.fine{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.stamp{position:absolute;right:16px;top:58px;width:78px;height:78px;border:3px double var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:900;transform:rotate(-12deg);opacity:.85;text-align:center;line-height:1.15;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stats div{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7}
.list li::marker{color:var(--orange)}
.src{font-size:12px;color:var(--muted);line-height:1.8}
.src a{color:var(--teal)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .go{flex:1 1 160px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink);background:var(--sky)}
@media (hover:hover) and (pointer:fine){#joy,#act{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="三民路一帶的 3D 街景"></canvas>

<div class="hud" id="hud" hidden>
  <div class="chip zone" id="zone">三民路三段<small>臺中市北區</small></div>
  <div class="hud-r">
    <div class="chip">記憶 <b id="found">0/6</b></div>
    <div class="chip">零用錢 <b id="money">200</b></div>
    <button class="chip btn" id="mapBtn" hidden>地圖 M</button>
    <button class="chip btn" id="sndBtn">聲音 開</button>
  </div>
</div>
<div id="toast"></div>
<div id="prompt" hidden></div>
<div id="joy" hidden><i></i></div>
<button id="act" hidden>說話</button>

<div id="dlg" hidden>
  <div class="dlg-card">
    <div class="dlg-name" id="dlgName"></div>
    <p class="dlg-text" id="dlgText"></p>
    <div class="choices" id="dlgChoices"></div>
    <button class="dlg-next" id="dlgNext">繼續 ▸（空白鍵）</button>
  </div>
</div>

<div id="mapWrap" hidden>
  <div class="map-card">
    <div class="map-head"><h2>三民路百年地圖</h2><button id="mapClose">關閉</button></div>
    <canvas id="map" width="870" height="765"></canvas>
    <p class="map-note">示意圖，不照比例。★ 已找到的記憶　◆ 還沒找到　● 你在這裡</p>
  </div>
</div>

<div class="sheet" id="start" hidden></div>
<div class="sheet" id="end" hidden></div>
<div id="loading">三民路上車有點多，地圖載入中⋯</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
/* ============ 資料來源 ============ */
const SRC={
  addr:{t:'臺中科大總務處',u:'https://ga.nutc.edu.tw/var/file/21/1021/img/1609/150373201.pdf'},
  hist:{t:'大學網（校史）',u:'https://www.unews.com.tw/School/Info/45'},
  yizhong:{t:'NOWnews（一中商圈）',u:'https://www.nownews.com/news/6224169'},
  ice:{t:'鏡週刊（一中豐仁冰）',u:'https://www.mirrormedia.mg/story/20260402food001'},
  chungyo:{t:'臺中市文化局（中友百貨）',u:'https://www.culture.taichung.gov.tw/media/819726/%E5%9F%8E%E5%B8%82%E8%97%9D%E7%AB%99-%E4%B8%AD%E5%8F%8B%E7%99%BE%E8%B2%A8%E5%85%AC%E5%8F%B8-%E7%8C%BF%E7%B7%A3%E5%9C%92%E8%97%9D%E8%A1%93%E9%A4%A8.pdf'},
  chungyo2:{t:'今周刊（中友與廣三 SOGO）',u:'https://www.businesstoday.com.tw/article/category/80404/post/199906100021/'},
  tcfsh:{t:'yam 蕃新聞（臺中一中）',u:'https://n.yam.com/Article/20250428513127'}
};

/* ============ 百年記憶（發光的光點） ============ */
const STORIES=[
 {id:'gate',x:-15.5,z:-9.5,title:'三民路三段 129 號',src:['addr','hist'],
  lines:['這裡是國立臺中科技大學三民校區，地址是臺中市北區三民路三段 129 號。','學校的起點在 1919 年，那時叫「臺灣公立臺中商業學校」。']},
 {id:'biz',x:-66,z:-27,title:'從臺中商專開始',src:['hist','addr'],
  lines:['1963 年，學校改制為省立臺中商業專科學校；1982 年改為國立臺中商業專科學校。','現在商學院在中商大樓和中技大樓上課。']},
 {id:'merge',x:-40,z:-34,title:'2011 年的合併',src:['hist','addr'],
  lines:['1999 年改制為技術學院。2011 年改名國立臺中科技大學，並和國立臺中護理專科學校合併。','三民校區有商學院、設計學院、語文學院、資訊與流通學院和智慧產業學院。']},
 {id:'street',x:22,z:0,title:'一中街怎麼來的',src:['yizhong'],
  lines:['一中街一帶以前有台中商專、台中體專和台中一中，學生本來就多。','補習班陸續進駐，吃的喝的也跟著聚集，慢慢變成今天以育才街、一中街為核心的一中商圈。']},
 {id:'ice',x:103,z:-33,title:'榕樹下的冰',src:['ice'],
  lines:['一中豐仁冰在 1946 年開始賣冰，創辦人原本做木製浴桶的生意。','早年在榕樹下擺攤三十多年，後來才搬到台中一中正門口斜對面。']},
 {id:'chungyo',x:-17,z:-104,title:'中友百貨',src:['chungyo','chungyo2'],
  lines:['中友百貨在 1992 年開幕，就在一中商圈旁邊。','1995 年廣三 SOGO 加入以前，中友長期是中台灣百貨業的龍頭。']}
];

/* ============ 一中街吃的（價格是遊戲設定） ============ */
const FOOD={
 chicken:{n:'雞排',p:75,say:'剛起鍋的雞排比你的臉還大。'},
 tea:{n:'珍珠奶茶',p:60,say:'半糖少冰，珍珠很 Q。'},
 douhua:{n:'豆花',p:45,say:'花生加粉圓，甜度剛好。'},
 ball:{n:'地瓜球',p:40,say:'一袋十二顆，邊走邊吃。'}
};

/* ============ 人物 ============ */
const NPCS=[
 {id:'guide',name:'學伴・小芸',x:-18,z:8,face:-1.6,look:{top:'#0f6e74',pants:'#2c3440',hair:'#2a1d18',long:true,bag:'#f08a24'},
  say(S){
   if(!S.hasMap)return {lines:['嗨，你是新生吧？我是你的學伴小芸，資管系三年級。','今天開學第一天，系上給新生一個任務：把三民路一帶的「百年記憶」找回來。','校園裡、一中街、育才街，還有中友百貨前面，一共藏了 6 個發光的光點。','這張「三民路百年地圖」給你，按 M 或右上角的「地圖」就能打開。','過三民路記得走斑馬線、等行人綠燈。'],then:'map'};
   if(S.found<STORIES.length)return {lines:[`你已經找到 ${S.found} 個記憶，還差 ${STORIES.length-S.found} 個。`,'打開地圖看看，菱形的就是還沒找到的地方。']};
   return {lines:['6 個都找齊了！你今天走的路，比很多學長姊大一一整年還多。','三民路 129 號從 1919 年走到現在，以後也輪到你了。歡迎報到。'],then:'end'};
  }},
 {id:'uncle',name:'校史志工・陳伯伯',x:-33,z:14,face:-1.6,look:{top:'#7a5c3e',pants:'#3a3a3a',hair:'#c9c9c9',glasses:true},
  say(){return {lines:['年輕人，第一天來喔？','這間學校的歲數，比你阿公還大。1919 年創校的時候叫臺中商業學校，後來變成臺中商專，大家都很熟。','1999 年改成技術學院，2011 年改名臺中科大，還跟臺中護專合併。','你去校園裡、商學院那邊找找，光點會告訴你更多。']}}},
 {id:'design',name:'設計學院・學姊',x:-101,z:-4,face:1.6,path:[[-101,-4],[-101,10]],look:{top:'#e5527a',pants:'#22252b',hair:'#5a2f1f',long:true,bag:'#2f2f2f'},
  say(){return {lines:['這棟是昌明樓，設計學院在這裡。','我昨天在教室趕作品到凌晨三點，下樓買宵夜，一中街還有攤子開著。','你如果要去一中街，記得留點零用錢。']}}},
 {id:'biz',name:'商學院・學長',x:-69,z:-14,face:-1.2,look:{top:'#2f4b7c',pants:'#2b2b2b',hair:'#1a1a1a'},
  say(){return {lines:['商學院在中商大樓和中技大樓兩棟上課。','中商大樓那邊有停車場，早上八點以前來比較好停。','光點就在中商大樓前面，你剛剛應該有看到在發光。']}}},
 {id:'cs',name:'資訊大樓・同學',x:-28,z:-40,face:-2.4,path:[[-28,-40],[-24,-30]],look:{top:'#4d4d4d',pants:'#25303b',hair:'#111',glasses:true},
  say(){return {lines:['資訊大樓是資訊與流通學院和智慧產業學院在用的。','我在等程式跑完。跑完我就要去中友地下美食街吃飯。']}}},
 {id:'cat',name:'校園橘貓・阿橘',x:-55,z:20,cat:true,path:[[-55,20],[-48,6],[-58,-6],[-62,10]],
  say(S){return {lines:S.found<3?['喵。','（阿橘看了一眼校門，又看了一眼一中街的方向。）']:['喵～','（阿橘在你腳邊打了一個滾，好像在說：快找齊了。）']}}},
 {id:'guard',name:'交通志工・林阿姨',x:11.4,z:-6.5,face:Math.PI,look:{top:'#e3c321',pants:'#2b2b2b',hair:'#2a2a2a',vest:true},
  say(){return {lines:['同學，三民路車很多。','過馬路一定要走斑馬線，看到小綠人再走；小綠人開始閃，就不要再衝了。','機車也很多，左右都要看。']}}},
 {id:'chicken',name:'雞排攤・老闆',x:21,z:-4,face:0,shop:['chicken'],look:{top:'#ffffff',pants:'#3a3a3a',hair:'#1a1a1a',apron:'#d6452f'},
  say(){return {lines:['雞排要不要？現炸的喔！']}}},
 {id:'tea',name:'飲料店・店員',x:30,z:-4,face:0,shop:['tea'],look:{top:'#7cc2a8',pants:'#2b2b2b',hair:'#3b2416',long:true,apron:'#2f6f5a'},
  say(){return {lines:['歡迎光臨！甜度冰塊幫你調。']}}},
 {id:'douhua',name:'豆花攤・阿姨',x:47,z:-4,face:0,shop:['douhua'],look:{top:'#f2e3c6',pants:'#5a4a3a',hair:'#444',long:true,apron:'#c98a2b'},
  say(){return {lines:['豆花要加什麼料？']}}},
 {id:'ball',name:'地瓜球攤・老闆',x:22,z:4,face:Math.PI,shop:['ball'],look:{top:'#ffd27a',pants:'#3a3a3a',hair:'#222',apron:'#8a5a2b'},
  say(){return {lines:['地瓜球！一袋十二顆！']}}},
 {id:'flyer',name:'補習班・發傳單的大哥',x:60,z:1,path:[[60,1],[80,-2],[70,2],[54,-1]],look:{top:'#e04f3a',pants:'#20242a',hair:'#111'},
  say(S){S.flyers++;return {lines:S.flyers<2?['同學，大學也有在補喔！英文、證照、轉學考、研究所，都可以來試聽！','（你手上多了一張傳單。）']:[`同學又是你！再一張。（你已經拿到 ${S.flyers} 張傳單。）`]}}},
 {id:'tcfsh',name:'臺中一中・學生',x:106,z:-24,face:Math.PI/2,look:{top:'#f4f4f4',pants:'#2d3a57',hair:'#111',bag:'#2d3a57'},

const CYCLE=22;
function lightState(){const t=clock%CYCLE;if(t<10)return {car:'green',ped:'stop'};if(t<12.5)return {car:'yellow',ped:'stop'};if(t<19)return {car:'red',ped:'walk'};return {car:'red',ped:'flash'}}
const LANES=[{x:-6.5,dir:1},{x:-2.5,dir:1},{x:2.5,dir:-1},{x:6.5,dir:-1}];
function makeVehicle(lane){const scooter=R()<.45;const g=new THREE.Group();const col=pick(['#e9e9e9','#d6452f','#2f4b7c','#1f1f1f','#7c8a96','#f0c33c','#5aa35a']);
  if(scooter){box(.6,.7,1.7,col,0,.55,0,{cast:true,parent:g});const r=person({top:pick(['#3a6ea5','#d6452f','#444','#e3a857']),pants:'#333',hair:'#222'});r.scale.set(.8,.8,.8);r.position.set(0,.2,-.1);g.add(r);
    const helm=new THREE.Mesh(GEO.sph,mat(pick(['#f2f2f2','#d6452f','#2f2f2f','#f0c33c'])));helm.scale.set(.66,.6,.66);helm.position.set(0,1.95,-.12);g.add(helm)}
  else{box(1.9,.8,4.2,col,0,.75,0,{cast:true,parent:g});box(1.7,.7,2.2,shade(col,.25),0,1.5,-.2,{parent:g});box(1.6,.5,.05,'#9fc3dd',0,1.55,.92,{parent:g});
    [[-.95,1.3],[.95,1.3],[-.95,-1.3],[.95,-1.3]].forEach(([x,z])=>box(.25,.6,.6,'#222',x,.3,z,{parent:g}))}
  const z=lane.dir>0?ROAD.z0+2:ROAD.z1-2;g.position.set(lane.x,0,z);g.rotation.y=lane.dir>0?0:Math.PI;scene.add(g);
  return {g,lane,z,len:scooter?1.8:4.3,v:scooter?11:10,vmax:(scooter?11:9.5)+R()*2.5,honkT:0}}
function updateVehicles(dt){const ls=lightState();
  LANES.forEach(l=>{l.t=(l.t||R()*3)-dt;if(l.t<=0){l.t=2.2+R()*3.5;const tail=vehicles.filter(v=>v.lane===l).sort((a,b)=>l.dir>0?a.z-b.z:b.z-a.z)[0];if(!tail||Math.abs(tail.z-(l.dir>0?ROAD.z0:ROAD.z1))>9)vehicles.push(makeVehicle(l))}});
  for(const v of vehicles){const d=v.lane.dir,front=v.z+d*v.len/2;let want=v.vmax;
    for(const c of CROSS){const line=d>0?c.z0-1.8:c.z1+1.8;const dist=(line-front)*d;if(dist<=-.3){if(v.commit===c)v.commit=null;continue}
      if(ls.car==='green'||v.commit===c)continue;const need=v.v*v.v/(2*14);if(dist<need&&v.v>2.5){v.commit=c;continue}want=Math.min(want,Math.sqrt(Math.max(0,2*10*(dist-.4))))}
    for(const o of vehicles){if(o===v||o.lane!==v.lane)continue;const gap=(o.z-v.z)*d-(o.len+v.len)/2;if(gap>-1&&gap<30)want=Math.min(want,Math.max(0,(gap-2.2)*1.4))}
    if(Math.abs(P.x-v.lane.x)<1.9){const gap=(P.z-v.z)*d-v.len/2;if(gap>-.5&&gap<9){want=0;v.honkT-=dt;if(v.honkT<=0&&gap<7){v.honkT=2.5;AU.honk()}}}
    v.v+=clamp(want-v.v,-14*dt,6*dt);v.z+=d*v.v*dt;v.g.position.z=v.z}
  vehicles=vehicles.filter(v=>{const out=v.lane.dir>0?v.z>ROAD.z1+4:v.z<ROAD.z0-4;if(out)scene.remove(v.g);return !out});
  const t=clock%CYCLE,fl=ls.ped==='flash'&&Math.floor(t*3)%2===0;
  LIGHTS.forEach(L=>{L.lamps[0].m.material.color.set(ls.car==='red'?L.lamps[0].col:'#3a3a3a');L.lamps[1].m.material.color.set(ls.car==='yellow'?L.lamps[1].col:'#3a3a3a');L.lamps[2].m.material.color.set(ls.car==='green'?L.lamps[2].col:'#3a3a3a');
    L.ped.material.color.set(ls.ped==='walk'||(ls.ped==='flash'&&!fl)?'#3ee07a':ls.ped==='flash'?'#1f5a33':'#ff4b3a')});
}

  g.fillStyle='#d6452f';g.beginPath();g.arc(X(P.x),Z(P.z),9,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
  g.fillStyle='rgba(28,39,51,.7)';g.font=`500 16px ${FONT}`;g.textAlign='left';g.fillText('↑ 北',12,22)}

/* ============ HUD ============ */
function zoneAt(x,z){for(const zn of ZONES)if(x>=zn.x0&&x<=zn.x1&&z>=zn.z0&&z<=zn.z1)return [zn.n,zn.s];
  if(x<-13&&x>-130&&Math.abs(z)<70){let b=null,bd=22;CAMPUS.forEach(c=>{const d=Math.max(Math.abs(x-c.x)-c.w/2,Math.abs(z-c.z)-c.d/2);if(d<bd){bd=d;b=c}});return [b?b.n:(Math.abs(z)<12&&x>-36?'校門口':'臺中科大三民校區'),'國立臺中科技大學']}
  return ['三民路一帶','臺中市北區']}
let lastZone='';
function hud(){$('found').textContent=`${S.found}/${STORIES.length}`;$('money').textContent=S.money}

/* ============ 主迴圈 ============ */
const CAMOFF={x:9,y:24,z:19},camT={x:0,z:0};let talkCD=0;
const ray=new THREE.Ray(),hitV=new THREE.Vector3(),headV=new THREE.Vector3();
function fadeOccluders(dt){headV.set(P.x,1.4,P.z);ray.origin.copy(camera.position);ray.direction.copy(headV).sub(camera.position);const dist=ray.direction.length();ray.direction.normalize();
  const cpx=camera.position.x,cpz=camera.position.z;
  for(const o of OCC){const under=cpx>o.box.min.x-3&&cpx<o.box.max.x+3&&cpz>o.box.min.z-3&&cpz<o.box.max.z+3;const hit=under||(ray.intersectBox(o.box,hitV)&&hitV.distanceTo(camera.position)<dist-.5);const t=hit?.2:1;if(Math.abs(o.a-t)<.01)continue;o.a+=(t-o.a)*Math.min(1,dt*8);if(Math.abs(o.a-t)<.02)o.a=t;
    const tr=o.a<.99;for(const m of o.mats){m.opacity=o.a;if(m.transparent!==tr){m.transparent=tr;m.depthWrite=!tr;m.needsUpdate=true}}}}
function update(dt){clock+=dt;if(talkCD>0)talkCD-=dt;
  updateVehicles(dt);
  // 角色走動
  let ix=0,iz=0;if(!paused){if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;if(keys.arrowup||keys.w)iz-=1;if(keys.arrowdown||keys.s)iz+=1;if(joy){ix=joy.x;iz=joy.y}}
  const L=Math.hypot(ix,iz);P.moving=L>.15;
  if(P.moving){const sp=7*Math.min(1,L),nx=ix/Math.max(1,L),nz=iz/Math.max(1,L);const r=.42;
    const tx=P.x+nx*sp*dt,tz=P.z+nz*sp*dt;if(canStand(tx,P.z,r))P.x=tx;if(canStand(P.x,tz,r))P.z=tz;
    const want=Math.atan2(nx,nz);let dr=want-P.rot;while(dr>Math.PI)dr-=Math.PI*2;while(dr<-Math.PI)dr+=Math.PI*2;P.rot+=dr*Math.min(1,dt*12)}
  player.position.set(P.x,0,P.z);player.rotation.y=P.rot;animPerson(player,clock,P.moving);
  // 過馬路規則
  const nowRoad=P.x>ROAD.x0+.2&&P.x<ROAD.x1-.2;
  if(nowRoad&&!onRoad){const cw=CROSS.find(c=>P.z>c.z0-.6&&P.z<c.z1+.6),ls=lightState();
    if(!cw){S.jay++;AU.whistle();toast('交通志工：同學，請走斑馬線喔！')}
    else if(ls.ped==='stop'){S.red++;AU.whistle();toast('交通志工：行人紅燈，等小綠人再過！')}}
  onRoad=nowRoad;
  // NPC
  for(const a of actors){const n=a.n;let moving=false;
    if(a.talk>0){a.talk-=dt;const ang=Math.atan2(P.x-a.x,P.z-a.z);a.g.rotation.y=ang}
    else if(n.path){const tgt=n.path[a.pi];const dx=tgt[0]-a.x,dz=tgt[1]-a.z,d=Math.hypot(dx,dz);
      if(a.wait>0)a.wait-=dt;else if(d<.2){a.pi=(a.pi+1)%n.path.length;a.wait=1.5+R()*2}else{const s=(n.cat?1.6:1.2)*dt;a.x+=dx/d*Math.min(s,d);a.z+=dz/d*Math.min(s,d);a.g.rotation.y=Math.atan2(dx,dz);moving=true}}
    a.g.position.set(a.x,0,a.z);a.tag.position.set(a.x,n.cat?1.8:3.1,a.z);animPerson(a.g,clock+a.x,moving)}
  // 光點
  for(const s of STORIES){if(S.got[s.id])continue;s.obj.position.y=1.6+Math.sin(clock*2+s.x)*.25;s.core.rotation.y+=dt*1.6;
    if(!paused&&Math.hypot(s.x-P.x,s.z-P.z)<1.5){collect(s);break}}
  // 互動提示
  const nt=paused?null:nearest();if(nt!==nearT){nearT=nt;const pr=$('prompt');if(nt){pr.innerHTML=`<kbd>E</kbd>和${esc(nt.n.name)}說話`;pr.hidden=false;$('act').textContent='說話'}else pr.hidden=true}
  // 區域
  const [zn,zs]=zoneAt(P.x,P.z),key=zn+zs;if(key!==lastZone){lastZone=key;$('zone').innerHTML=`${esc(zn)}<small>${esc(zs)}</small>`}
  // 鏡頭
  const k=Math.min(1,dt*5);camT.x+=(P.x-camT.x)*k;camT.z+=(P.z-1.5-camT.z)*k;
  camera.position.set(camT.x+CAMOFF.x*camZoom,CAMOFF.y*camZoom,camT.z+CAMOFF.z*camZoom);camera.lookAt(camT.x,0,camT.z);
  W.sun.position.set(P.x+40,80,P.z+30);W.sun.target.position.set(P.x,0,P.z);
  fadeOccluders(dt);
}
function frame(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(frame)}

/* ============ 開始與結束 ============ */
function fmtT(ms){const s=Math.round(ms/1000);return `${Math.floor(s/60)} 分 ${String(s%60).padStart(2,'0')} 秒`}
function renderStart(){const best=store('sm_best');
  $('start').innerHTML=`<div class="card">
    <div class="form-head"><span>新生報到單</span><dl><dt>報到日</dt><dd>開學第一天</dd><dt>地點</dt><dd>三民校區</dd></dl></div>
    <div class="stamp" aria-hidden="true">歡迎<br>報到</div>
    <p class="eyebrow">國立臺中科技大學・三民校區</p>
    <h1 class="title">三民路<br><em>129</em> 號</h1>
    <p class="lede">開學第一天。學伴小芸在校門口等你，要你把三民路一帶的 6 個「百年記憶」找回來：校園、一中街、育才街，還有中友百貨。</p>
    <ul class="rows">
      <li><b>移動</b><span>方向鍵或 WASD；手機用左下角搖桿</span></li>
      <li><b>說話</b><span>靠近人按 E 或空白鍵；手機按右下角「說話」</span></li>
      <li><b>地圖</b><span>拿到地圖後按 M</span></li>
      <li><b>過馬路</b><span>三民路車很多，走斑馬線、等小綠人</span></li>
      <li><b>零用錢</b><span>NT$200，可以在一中街買吃的</span></li>
    </ul>
    <button class="go" id="goBtn">走進校門</button>
    <p class="fine">非官方作品，與國立臺中科技大學、中友百貨、各店家無關。地圖為示意，不照比例；人物是虛構的。${best?`你最快的紀錄：${esc(best)}。`:''}</p>
  </div>`;
  $('start').hidden=false;$('goBtn').onclick=start}
function start(){AU.init();AU.bgm();syncSnd();hud();$('start').hidden=true;$('hud').hidden=false;
  if(matchMedia('(hover:none),(pointer:coarse)').matches){$('joy').hidden=false;$('act').hidden=false}
  S.t0=performance.now();running=true;paused=false;last=performance.now();requestAnimationFrame(frame);
  setTimeout(()=>toast('學伴小芸在校門口內側等你'),600)}
function showEnd(){if(S.ended)return;S.ended=true;running=false;AU.fanfare();const ms=performance.now()-S.t0,t=fmtT(ms);
  const prev=+store('sm_best_ms')||0;if(!prev||ms<prev){store('sm_best_ms',Math.round(ms));store('sm_best',t)}
  const srcKeys=[...new Set(STORIES.flatMap(s=>s.src).concat(['tcfsh']))];
  $('end').innerHTML=`<div class="card">
    <div class="form-head"><span>報到完成</span><dl><dt>用時</dt><dd>${t}</dd></dl></div>
    <div class="stamp" aria-hidden="true">報到<br>完成</div>
    <p class="eyebrow">國立臺中科技大學・三民校區</p>
    <h1 class="title">歡迎<br><em>報到</em></h1>
    <p class="lede">你把三民路 129 號、一中街、育才街和中友百貨都走了一遍，找回了 6 個百年記憶。</p>
    <div class="stats">
      <div><b>${S.found}/${STORIES.length}</b>百年記憶</div>
      <div><b>${S.eaten.length}</b>一中街吃了幾樣</div>
      <div><b>${S.flyers}</b>補習班傳單</div>
      <div><b>${S.jay+S.red}</b>被交通志工叫住</div>
    </div>
    <ol class="list">${STORIES.map(s=>`<li><b>${esc(s.title)}</b>：${esc(s.lines[0])}</li>`).join('')}</ol>
    ${S.eaten.length?`<p class="lede">一中街：${esc(S.eaten.join('、'))}。零用錢剩 NT$${S.money}。</p>`:'<p class="lede">你一樣都沒吃。下次記得留點時間給一中街。</p>'}
    <div class="btnrow"><button class="go" id="againBtn">再逛一次</button></div>
    <p class="src">資料來源：${srcKeys.map(k=>`<a href="${SRC[k].u}" target="_blank" rel="noopener">${esc(SRC[k].t)}</a>`).join('、')}</p>
    <p class="fine">非官方作品。地圖為示意，不照比例；人物是虛構的；一中街的價格是遊戲設定。</p>
  </div>`;
  $('end').hidden=false;$('hud').hidden=true;$('joy').hidden=true;$('act').hidden=true;$('prompt').hidden=true;
  $('againBtn').onclick=()=>location.reload()}

/* ============ 啟動 ============ */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:48;camera.updateProjectionMatrix()}
async function boot(){
  if(!window.THREE){$('loading').textContent='3D 函式庫載入失敗，請重新整理再試一次。';return}
  try{await Promise.race([document.fonts.load(`900 64px "Noto Sans TC"`),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=Math.min(innerWidth,innerHeight)<700?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
  const gm=new THREE.DataTexture(new Uint8Array([120,190,240]),3,1,renderer.capabilities.isWebGL2?THREE.RedFormat:THREE.LuminanceFormat);gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;TOON=gm;
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(48,1,.5,600);
  buildWorld();initActors();resize();addEventListener('resize',resize);
  camT.x=P.x;camT.z=P.z-1.5;camera.position.set(camT.x+CAMOFF.x,CAMOFF.y,camT.z+CAMOFF.z);camera.lookAt(camT.x,0,camT.z);W.sun.target.position.set(P.x,0,P.z);
  renderer.render(scene,camera);$('loading').hidden=true;renderStart();
  window.__g={S,P,STORIES,actors,teleport(x,z){P.x=x;P.z=z},lightState,get vehicles(){return vehicles},showEnd,step(n,dt){for(let i=0;i<n;i++)update(dt||1/30)},hold(k,v){keys[k]=v}};
}
boot();
