<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>責任不外包</title>
<meta name="description" content="委外訓練單位承辦人的一天：招生、找老師、津貼、評選、查課、就業追蹤，處處是坑。改編自真實新聞案例的小遊戲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: the start screen is a 簽 form on a 560px column; play is a full-screen top-down training-centre canvas under a navy 打卡鐘 HUD; every event slides up as a 工作聯繫單 with 甲乙丙案 to pick from. */
:root{
  --ground:#e4e8e3; --sheet:#fcfcf7; --ink:#1d2330; --muted:#596273; --rule:#d2d7cf;
  --seal:#bf2a1e; --blue:#1d4f91; --ok:#2b7a4b; --hud:#1d2a3d; --hud-ink:#e9eef5; --led:#ffb547;
  --over-bg:#101317; --over-fg:#e8ebee; --over-rule:rgba(255,255,255,.18);
  --shadow:0 1px 0 rgba(29,35,48,.08),0 8px 22px -12px rgba(29,35,48,.4);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-doc:"LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121619; --sheet:#1b2026; --ink:#e3e7ec; --muted:#9aa3b0; --rule:#2e353e;
  --seal:#ff6b5c; --blue:#8fb2ff; --ok:#6fd39a; --hud:#152033; --hud-ink:#e9eef5; --led:#ffb547;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121619; --sheet:#1b2026; --ink:#e3e7ec; --muted:#9aa3b0; --rule:#2e353e;
  --seal:#ff6b5c; --blue:#8fb2ff; --ok:#6fd39a; --hud:#152033; --hud-ink:#e9eef5; --led:#ffb547;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.85); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:inherit}

/* ===== 首頁：公文「簽」 ===== */
.memo{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:20px 20px 24px;display:grid;gap:14px;overflow:hidden}
.memo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.org{font-family:var(--f-doc);font-size:17px;font-weight:700;letter-spacing:.12em}
.meta{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:12px;color:var(--muted);margin:0}
.meta dt{letter-spacing:.1em}.meta dd{margin:0;color:var(--seal);font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0}
.title{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,64px);line-height:1.12;letter-spacing:.04em}
.title em{font-style:normal;color:var(--seal)}
.tag{font-family:var(--f-doc);font-size:20px;margin:0}
.msec{display:grid;grid-template-columns:4.2em 1fr;gap:0 4px;font-family:var(--f-doc);font-size:17px;line-height:1.8}
.msec h2{font-size:17px;font-weight:700;font-family:var(--f-doc)}
.msec p{margin:0;min-width:0}
.cn{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-width:0}
.cn li{display:grid;grid-template-columns:2em 1fr}
.cn li>span:first-child{font-weight:700}
.cn b{color:var(--seal);font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.cn small,.src{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.flowline{font-size:15px;color:var(--muted)}
.primary{background:var(--seal);color:#fff;border:none}
.big-btn{display:block;width:100%;max-width:320px;padding:15px;border-radius:6px;font-size:17px;font-weight:700;letter-spacing:.12em;box-shadow:0 3px 0 color-mix(in srgb,var(--seal) 60%,#000)}
.big-btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--seal) 60%,#000)}
.hint{font-size:13px;color:var(--muted);margin:0}
.decide{position:absolute;right:18px;top:64px;width:76px;height:76px;border:3px double var(--seal);color:var(--seal);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.1em;transform:rotate(-14deg);opacity:.85;pointer-events:none}
.record{font-size:12px;color:var(--muted);margin:0}

/* ===== 遊戲外框 ===== */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#2a3038;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{background:var(--hud);color:var(--hud-ink);padding:8px 14px 9px;display:grid;gap:6px;border-bottom:3px solid #0d1522;flex:none}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud-l{min-width:0}
.who{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:"Noto Sans TC",ui-monospace,monospace;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:var(--led);text-shadow:0 0 10px rgba(255,181,71,.45);letter-spacing:.04em}
.hud-r{display:flex;align-items:center;gap:12px}
.ctr{text-align:right;font-size:10px;letter-spacing:.08em;opacity:.9;line-height:1.3}
.ctr b{display:block;font-size:18px;letter-spacing:0;font-variant-numeric:tabular-nums}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--hud-ink);border-radius:4px;padding:3px 8px;font-size:12px;white-space:nowrap}
.flow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;font-size:11px;white-space:nowrap}
.flow::-webkit-scrollbar{display:none}
.flow span{padding:1px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.22);opacity:.6}
.flow span.done{opacity:.35;text-decoration:line-through}
.flow span.now{opacity:1;background:var(--led);color:#1d2330;border-color:var(--led);font-weight:700}
.goalrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
.goal{font-size:12.5px;color:var(--led);min-width:0}
.sbtns{display:flex;gap:6px}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(16,20,26,.9);color:#f2f2ea;padding:7px 14px;border-radius:6px;font-size:13.5px;text-align:center;pointer-events:none;transition:opacity .3s;opacity:0}
#toast.on{opacity:1}
#banner{position:absolute;left:50%;top:36%;width:max-content;transform:translate(-50%,-50%) scale(.96);text-align:center;color:#fff;background:rgba(16,20,26,.88);padding:14px 26px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;max-width:calc(100% - 32px)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner b{display:block;font-size:28px;letter-spacing:.06em;color:var(--led);font-variant-numeric:tabular-nums}
#banner span{display:block;font-size:15px;margin-top:4px}
.ctlhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .6s}
#shade{position:absolute;inset:0;background:rgba(8,11,15,.5)}
#modal{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;padding:0 12px 14px;overscroll-behavior:contain}
#modal .doc{max-width:560px;margin:16px auto 0}
#pauseMsg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,15,.55);color:#fff;font-family:var(--f-display);font-size:28px;letter-spacing:.3em}

/* ===== 便箋（事件卡） ===== */
.doc{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:16px 18px 18px;position:relative}
.doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.doc-head .org{font-size:15px}
.speed{font-size:12px;color:var(--seal);border:1.5px solid var(--seal);padding:0 6px;border-radius:2px;letter-spacing:.1em;font-weight:700}
.speak{margin-left:auto;background:transparent;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 10px;font-size:12px}
.doc-meta{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.doc h2{font-family:var(--f-doc);font-weight:700;font-size:22px;line-height:1.4;margin-top:6px}
.lbl{color:var(--muted);font-weight:700}
.narr{font-family:var(--f-doc);font-size:18px;line-height:1.75;margin:6px 0 0;max-width:60ch}
.lbl2{font-family:var(--f-doc);font-size:16px;color:var(--muted);font-weight:700;margin-top:12px}
.choices{display:grid;gap:9px;margin-top:6px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card .k{flex:none;font-family:var(--f-doc);font-weight:700;color:var(--blue);font-size:15px;padding-top:1px;white-space:nowrap}
.card .t{min-width:0;font-size:15px;font-weight:500;line-height:1.55;padding-top:1px}
.card[disabled]{opacity:.35;box-shadow:none;cursor:default;transform:none}
.card.picked{opacity:1;border-color:var(--blue);box-shadow:3px 3px 0 var(--blue)}
.result{margin-top:14px;padding-top:12px;border-top:2px dashed var(--rule);display:grid;gap:10px}
.result .narr{margin:0}
.stamp{justify-self:start;font-family:var(--f-display);font-weight:900;font-size:24px;padding:2px 12px;letter-spacing:.15em;transform:rotate(-6deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both;border:3px double currentColor}
.stamp.bad{color:var(--seal)}
.stamp.file{color:var(--blue);font-size:19px}
.stamp.ok{color:var(--ok);font-size:19px}
@keyframes slam{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.reason{font-size:14.5px;color:var(--seal);font-weight:500;margin:0}
.odds{font-size:12.5px;color:var(--muted);margin:0}
.pit{font-size:13.5px;line-height:1.6;margin:0;padding:8px 10px;border-left:3px solid var(--seal);background:color-mix(in srgb,var(--seal) 7%,var(--sheet))}
.pit b{color:var(--seal);margin-right:8px;letter-spacing:.1em}
.ctr.low b{color:#ff9a8f}
.ctr.warn b{color:#ff6b5c;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.pitbox{border-color:rgba(255,90,74,.5)}
.go{justify-self:stretch;margin-top:2px;padding:12px;border:none;border-radius:4px;background:var(--ink);color:var(--sheet);font-weight:700;letter-spacing:.1em}

/* ===== 結局 ===== */
.over{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--over-bg);color:var(--over-fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.over.win{background:var(--ground);color:var(--ink)}
.over .wrap{padding-block:40px 64px;display:grid;gap:4px}
.over .eyebrow{color:inherit;opacity:.65}
.big{font-family:var(--f-display);font-weight:900;font-size:clamp(42px,13vw,68px);letter-spacing:.1em;line-height:1.1;margin-top:6px}
.over:not(.win) .big{color:#ff5a4a;animation:fadein 1.2s ease both}
@keyframes fadein{from{opacity:0;letter-spacing:.45em}to{opacity:1}}
.lede{font-size:17px;margin:12px 0 0;max-width:34em}
.quote{margin:12px 0 0;padding:10px 14px;border-left:4px solid #ff5a4a;font-family:var(--f-doc);font-size:19px;line-height:1.7;background:rgba(255,90,74,.08)}
.sect{margin-top:28px;border-top:1px solid var(--over-rule);padding-top:16px}
.over.win .sect{border-top-color:var(--rule)}
.sect h3{font-size:13px;letter-spacing:.2em;opacity:.7;font-weight:500}
.ledger{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;font-family:var(--f-doc);font-size:17.5px;line-height:1.65}
.ledger li{display:grid;grid-template-columns:4.4em 1fr;gap:8px}
.ledger time{font-family:var(--f-ui);font-size:12px;opacity:.6;padding-top:4px;font-variant-numeric:tabular-nums}
.ledger .sub{display:block;font-size:15px;opacity:.7}
.realbox{margin-top:16px;padding:16px;border:1px solid var(--over-rule);border-radius:4px;background:rgba(255,255,255,.04)}
.over.win .realbox{border-color:var(--rule);background:var(--sheet)}
.realtag{display:inline-block;font-family:var(--f-display);font-weight:900;color:#ff5a4a;border:2px solid #ff5a4a;padding:0 8px;letter-spacing:.15em;transform:rotate(-3deg)}
.over.win .realtag{color:var(--seal);border-color:var(--seal)}
.realbox p{margin:10px 0 0;font-size:15.5px;line-height:1.8}
.realbox .res{opacity:.85}
.realbox .src{color:inherit;opacity:.7}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
.facts div{font-size:13px;line-height:1.5;min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;color:var(--seal)}
.tribute{font-family:var(--f-doc);font-size:18.5px;line-height:1.9;margin-top:12px;max-width:34em}
.tribute p{margin:0 0 10px}
.ending-name{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--seal);margin-top:4px}
.hotline{font-size:15px;margin-top:10px}
.hotline b{font-size:20px;font-variant-numeric:tabular-nums;user-select:all}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.row button{flex:1 1 150px;padding:12px;border-radius:6px;font-weight:700;letter-spacing:.08em}
.ghost{background:transparent;border:1.5px solid currentColor}
.fade-in{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.decide{width:60px;height:60px;font-size:17px;top:58px;right:12px}.clock{font-size:24px}.hud-r{gap:8px}}
</style>
</head>
<body>

<div class="wrap" id="startWrap"><main id="main"></main></div>

<div id="game" hidden>
  <div class="hud">
    <div class="hud-top">
      <div class="hud-l"><div class="who" id="who">第 1 天</div><div class="clock" id="clock">08:00</div></div>
      <div class="hud-r">
        <div class="ctr">在訓<b id="st">28</b><span id="skips" hidden></span></div>
        <div class="ctr">待補件<b id="pile">0/20</b></div>
        <div class="ctr">就業率<b id="kpi">68%</b></div>
        <button class="hbtn" id="pauseBtn" aria-label="暫停">暫停</button>
      </div>
    </div>
    <div class="flow" id="flow"></div>
    <div class="goalrow"><div class="goal" id="goal"></div><div class="sbtns"><button class="hbtn" id="sndBtn">聲音 開</button><button class="hbtn" id="voBtn">朗讀 關</button></div></div>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="訓練中心地圖"></canvas>
    <div id="toast"></div>
    <div id="banner"></div>
    <div class="ctlhint" id="ctlhint">按住畫面拖曳移動 · 鍵盤用方向鍵</div>
    <div id="pauseMsg" hidden>暫停中</div>
    <div id="shade" hidden></div>
    <div id="modal" hidden></div>
  </div>
</div>
<div id="over" class="over" hidden></div>

<script>
/* ============ 新聞與規範來源 ============ */
const SRC={
  lion1:{t:'工商時報',u:'https://ctee.com.tw/news/industry/858817.html'},
  lion2:{t:'勞動部',u:'https://www.mol.gov.tw/1607/1632/2660/59854/'},
  agent:{t:'勞動部',u:'https://www.mol.gov.tw/1607/1632/1640/17763/post'},
  bid:{t:'新頭殼',u:'https://newtalk.tw/news/view/2026-04-16/1030100'},
  tims:{t:'委託辦理職前訓練作業原則',u:'https://job.tainan.gov.tw/wp-content/uploads/2021/02/%E5%A7%94%E8%A8%97%E8%BE%A6%E7%90%86%E8%81%B7%E5%89%8D%E8%A8%93%E7%B7%B4%E4%BD%9C%E6%A5%AD%E5%8E%9F%E5%89%87-%E5%88%97%E5%8D%B0.pdf'},
  wage:{t:'勞動部',u:'https://www.mol.gov.tw/1607/1632/1640/62116/post'},
  star:{t:'臺南市職業訓練業務檢討會',u:'https://job.tainan.gov.tw/wp-content/uploads/2019/12/107%E8%81%B7%E6%A5%AD%E8%A8%93%E7%B7%B4%E6%9C%9F%E6%9C%AB%E6%A5%AD%E5%8B%99%E6%AA%A2%E8%A8%8E%E6%9C%83-1128.pdf'},
  harass:{t:'臺北市職訓單位性騷擾防治要點',u:'https://www-ws.gov.taipei/001/Upload/451/relfile/62595/9041637/a30788c2-9aba-47fd-a038-c45e427de0d7.pdf'},
  invest:{t:'產業人才投資計畫說明',u:'https://dtextpro.kmu.edu.tw/attachments/article/263/104-%E4%B8%8B%20%E7%94%A2%E6%A5%AD%E4%BA%BA%E6%89%8D%E6%8A%95%E8%B3%87%E8%A8%88%E7%95%AB.pdf'}
};

/* ============ 真實案例卡 ============ */
const CASES=[
 {id:'lion',tag:'A',ti:'沒開成的課',tx:'上個月有兩堂課沒開成。主任說：「課表照報，講師費照核，反正預算核定了。」',
  ch:[{l:'照報',rep:1,z:'核銷未實際辦理的課程，詐領補助。',o:'你被搜索了',rule:'核銷要跟實際上課一致。同一位講師同一天出現在兩個地方，查核時一比對就會發現。'},{l:'照實核銷，剩下的繳回',safe:1,r:'結餘款繳回了。主任說明年預算會被砍。',pile:1}],
  real:'2019 年，雄獅旅行社申請勞動部「企業人力資源提升計畫」補助，部分課程沒有實際舉辦。稽核時發現，同一位講師同一天出現在兩個不同地點，核銷了兩筆講師費。',
  res:'2023 年新北地檢署搜索，3 名職員以偽造文書、詐欺偵辦，各以 10 萬元交保。勞動部北分署說 99 萬餘元補助款已全數追回；勞動部表示將停權 2 年。',src:['lion1','lion2']},

const AU=(()=>{
  let ctx=null,on=true;
  try{on=localStorage.getItem('pxt_snd')!=='0'}catch(e){}
  function init(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ctx=new AC()}catch(e){return}}if(ctx.state==='suspended')ctx.resume()}
  function tone(f,t,d,type,vol){if(!ctx||!on)return null;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.05);return o}
  function noise(t,d,vol,f1,f2){if(!ctx||!on)return;const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+d)}
  const now=()=>ctx?ctx.currentTime+.02:0;
  return {init,
    get on(){return on},
    setOn(v){on=v;try{localStorage.setItem('pxt_snd',v?'1':'0')}catch(e){}},
    pause(v){if(ctx){try{v?ctx.suspend():ctx.resume()}catch(e){}}},
    dingdong(){if(!ctx)return;const t=now();[[659.3,0],[523.3,.42]].forEach(([f,d])=>{tone(f,t+d,1.3,'sine',.2);tone(f*2,t+d,.6,'sine',.05)})},
    stamp(){if(!ctx)return;const t=now();noise(t,.12,.6,1200,300);const o=tone(130,t,.35,'sine',.5);if(o)o.frequency.exponentialRampToValueAtTime(45,t+.3)},
    file(){if(!ctx)return;const t=now();noise(t,.18,.25,3000,1200);noise(t+.12,.14,.18,2500,900)},
    ok(){if(!ctx)return;const t=now();tone(784,t,.25,'triangle',.12);tone(1046.5,t+.1,.4,'triangle',.12)},
    whoosh(){if(!ctx)return;noise(now(),.45,.3,400,2400)},
    click(){if(!ctx)return;noise(now(),.05,.15,2500,1500)},
    phone(){if(!ctx)return;const t=now();for(let i=0;i<6;i++){tone(1350,t+i*.09,.07,'square',.05)}},
    doom(){if(!ctx)return;const t=now();tone(55,t,2.6,'sawtooth',.1);tone(58.3,t,2.6,'sawtooth',.07);tone(110,t,1,'sine',.14)},
    fanfare(){if(!ctx)return;const t=now();[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,t+i*.13,i===3?.9:.25,'square',.06))}
  };
})();
const VO=(()=>{
  const ok=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
  let voice=null,auto=false;
  try{auto=localStorage.getItem('pxt_vo')==='1'}catch(e){}
  function pickVoice(){if(!ok)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null}
  if(ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
  function speak(text){if(!ok)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
  function stop(){if(ok)try{speechSynthesis.cancel()}catch(e){}}
  return {ok,speak,stop,get auto(){return auto},setAuto(v){auto=v;try{localStorage.setItem('pxt_vo',v?'1':'0')}catch(e){}if(!v)stop()}};
})();

function drawCard(tag){
  let pool=ALL.filter(c=>c.tag===tag&&!S.used.has(c.id));
  if(!pool.length)pool=ALL.filter(c=>(c.tag==='Bc'||c.tag==='H'||c.tag==='E')&&!S.used.has(c.id));
  if(!pool.length)pool=ALL.filter(c=>c.tag===tag);
  const r=pool.filter(c=>c.kind==='r'),s=pool.filter(c=>c.kind==='s');
  return (r.length&&(R()<.32||!s.length))?pick(r):pick(s);
}

 {x:18,y:1,w:2,h:2,f:2,lab:'↓ 1F',to:{x:8.5,y:5.5},msg:'下 1F'},

function floorOf(x,y){if(y>=19.5)return 0;return x<11?1:x<22?2:3}

function fillG(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=v}
function buildWorld(){
  grid=Array.from({length:MH},()=>Array(MW).fill(1));

  fillG(1,20,32,5,2);                                            // 街道
  fillG(5,19,2,1,7);                                             // 1F 大門
  fillG(1,15,10,4,7);fillG(1,14,7,1,8);                          // 1F 大廳與櫃檯
  fillG(1,17,3,1,9);fillG(8,17,3,1,9);
  fillG(1,8,4,2,6);fillG(6,8,4,2,6);fillG(1,11,4,2,6);fillG(7,11,3,2,6);
  ROOMS.forEach(r=>fillG(r.x,r.y,r.w,r.h,3));
  STAIRS.forEach(t=>fillG(t.x,t.y,t.w,t.h,11));

const exitOpen=()=>S&&PHASES[S.ph]&&PHASES[S.ph].dest==='exit';
function walkable(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=MW||ty>=MH)return false;const c=grid[ty][tx];if(c===5)return exitOpen();return c===0||c===2||c===7||c===11}
function blocked(x,y,r){return !walkable(x-r,y-r)||!walkable(x+r,y-r)||!walkable(x-r,y+r)||!walkable(x+r,y+r)}
function moveEnt(e,dx,dy,r){const ox=e.x,oy=e.y;if(!blocked(e.x+dx,e.y,r))e.x+=dx;if(!blocked(e.x,e.y+dy,r))e.y+=dy;return Math.hypot(e.x-ox,e.y-oy)}
function randTile(near,rad,ok){for(let k=0;k<80;k++){const x=near?clamp(Math.floor(near.x)+rint(-rad,rad),1,MW-2):rint(1,MW-2);const y=near?clamp(Math.floor(near.y)+rint(-rad,rad),1,MH-2):rint(1,MH-2);const c=grid[y][x];if((c===0||c===2||c===7)&&(!ok||ok(x,y)))return {x:x+.5,y:y+.5}}return {x:6.5,y:21.5}}

let camSnap=false,P,NPCS,running=false,paused=false,userPaused=false,last=0,grace=0,keys={},joy=null,camX=0,camY=0,zoom=1,dpr=1,cvW=0,cvH=0,walkT=0,staticCv=null,toastT=null,bannerT=null,hintShown=0;

function citizen(p,chase,reg){return {type:'citizen',x:p.x,y:p.y,spd:chase?2.5:1.3+R()*.5,cool:chase?0:2+R()*4,body:pick(SHIRTS),hair:pick(['#2a2420','#3b3029','#6d6d6d','#1b1b1b']),tgt:null,stuck:0,chase:!!chase,life:chase?32:0,reg:reg||inLobby}}

function updNPC(n,dt){
  if(n.cool>0)n.cool-=dt;
  if(n.chase){n.life-=dt;let goal;
    if(n.life<=0||n.done){goal={x:2.5,y:24.3};if(floorOf(n.x,n.y)===0&&Math.hypot(n.x-2.5,n.y-24.3)<.8){n.gone=true;return}}
    else goal={x:P.x,y:P.y};
    if(!(n.detour>0)){const a=floorOf(n.x,n.y),b=floorOf(goal.x,goal.y);n.tgt=a===b?goal:nextHop(a,b)}}
  else if(!n.tgt||Math.hypot(n.tgt.x-n.x,n.tgt.y-n.y)<.3)n.tgt=randTile(n,7,n.reg);

  const dx=n.tgt.x-n.x,dy=n.tgt.y-n.y,L=Math.hypot(dx,dy)||1,s=n.spd*dt;
  const m=moveEnt(n,dx/L*s,dy/L*s,.28);n.walk=(n.walk||0)+m*3;n.fx=dx/L;n.fy=dy/L;

}

function update(dt){
  if(S.night)return;
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;

  if(P.moving){const nx=ix/Math.max(1,L),ny=iy/Math.max(1,L),h=Math.hypot(nx,ny)||1;P.fx=nx/h;P.fy=ny/h;walkT+=moveEnt(P,nx*4.4*dt,ny*4.4*dt,.3);

  NPCS.forEach(n=>updNPC(n,dt));NPCS=NPCS.filter(n=>!n.gone);
  if(S.bombNow){S.bombT-=dt;if(S.bombT<=0){const b=S.bombNow;S.bombNow=null;AU.phone();if(b.card){banner('性平事件','大魔王來了。');AU.doom()}return openCase(b.card||bombCard(b),b.card?'性平事件':'舊案回來了',()=>{})}}

  // 申訴單
  S.paperT-=dt;if(S.paperT<=0){S.paperT=Math.max(6,rint(9,15)-(S.day-1));spawnPaper()}

    if(p.wait>0){p.wait-=dt;if(p.wait<=0){const dx=P.x-p.x,dy=P.y-p.y,l=Math.hypot(dx,dy)||1;p.vx=dx/l*8.5;p.vy=dy/l*8.5}continue}

}

    else{c.fillStyle='#8b5e3c';c.fillRect(px-7,py+2,14,10);c.fillStyle='#4f8f4a';c.beginPath();c.arc(px,py-2,10,0,7);c.fill()}}
  // 機車
  SCOOTERS.forEach(([x,y,col])=>{const px=x*TS+TS/2,py=y*TS+TS/2,gov=col==='gov';
    c.fillStyle='rgba(0,0,0,.25)';rr(c,px-7,py-12,16,28,6);c.fill();
    c.fillStyle=gov?'#f4f4ef':col;rr(c,px-8,py-14,16,28,6);c.fill();c.fillStyle='#20262e';c.fillRect(px-9,py-12,18,3);
    if(gov)label(c,'公司機車',px,py+24,{s:9,c:'#fff',bg:'#1d4f91'})});
  label(c,'騎樓',3*TS,20.5*TS,{s:10,c:'rgba(255,255,255,.7)'});
  // 打卡鐘
  c.fillStyle='#20262e';rr(c,9*TS+6,18*TS+6,22,20,3);c.fill();c.fillStyle='#ffb547';c.fillRect(9*TS+10,18*TS+10,14,5);
  // 坐著的同事
  [[3.0,10.4],[7.5,7.6],[8.5,13.4]].forEach(([x,y],i)=>{const px=x*TS,py=y*TS;
    c.fillStyle='#4a525e';rr(c,px-10,py-2,20,14,4);c.fill();
    c.fillStyle=['#7d8fa8','#a87d7d','#7da88a'][i%3];c.beginPath();c.ellipse(px,py+1,11,8,0,0,7);c.fill();
    c.fillStyle='#2a2420';c.beginPath();c.arc(px,py-3,5.5,0,7);c.fill();c.fillStyle='#f0c9a4';c.beginPath();c.arc(px,py-6,3.5,0,7);c.fill()});
}
function person(c,n,isP){
  const px=n.x*TS,py=n.y*TS,b=Math.sin((isP?walkT:(n.walk||0))*2.2)*(isP?(P.moving?1.6:0):1.2),fx=n.fx||0,fy=n.fy==null?1:n.fy;
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(px,py+9,10,4,0,0,7);c.fill();
  c.fillStyle=n.body;c.beginPath();c.ellipse(px,py+2+b*.3,10,8,0,0,7);c.fill();
  if(isP){c.strokeStyle='#1d4f91';c.lineWidth=2;c.beginPath();c.moveTo(px-5,py-3);c.lineTo(px,py+5);c.lineTo(px+5,py-3);c.stroke();c.fillStyle='#1d4f91';c.fillRect(px-3,py+4,6,6)}
  c.fillStyle=n.hair;c.beginPath();c.arc(px-fx*1.5,py-6-fy*1.5+b*.2,7,0,7);c.fill();
  c.fillStyle='#f0c9a4';c.beginPath();c.arc(px+fx*2,py-5+fy*2+b*.2,5,0,7);c.fill();
  if(n.label)label(c,n.label,px,py-22,{s:10,bg:n.type==='aide'?'#7a1f1f':n.type==='boss'?'#24324d':'#5a4a33'});
}
function render(time){
  const c=cx;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#2a3038';c.fillRect(0,0,cvW,cvH);
  if(!staticCv||!P)return;
  const vw=cvW/zoom,vh=cvH/zoom,mw=MW*TS,mh=MH*TS;
  const tx=vw>=mw?(mw-vw)/2:clamp(P.x*TS-vw/2,0,mw-vw),ty=vh>=mh?(mh-vh)/2:clamp(P.y*TS-vh/2,0,mh-vh);
  if(camSnap){camX=tx;camY=ty;camSnap=false}else{camX+=(tx-camX)*.2;camY+=(ty-camY)*.2}
  c.save();c.scale(zoom,zoom);c.translate(-camX,-camY);
  c.drawImage(staticCv,0,0);
  // 大門
  const open=exitOpen();c.fillStyle=open?'#5fbf7f':'#a8443a';c.fillRect(1*TS,25*TS,3*TS,6);
  label(c,open?'回家・開':'回家',2.5*TS,25*TS+16,{s:11,c:'#fff'});
  // 目的地
  let dp=null,gp=null;
  if(S&&S.dest&&!S.arrived&&!S.night){dp=S.dest==='exit'?{x:2.5,y:25.2}:destPoint();{const a=floorOf(P.x,P.y),b=floorOf(dp.x,dp.y);gp=a===b?dp:nextHop(a,b);if(gp!==dp){const pl=(Math.sin(time*6)+1)/2;label(c,b>a?'往上走':'往下走',gp.x*TS,gp.y*TS+22,{s:11,c:'#1d2330',bg:`rgba(255,181,71,${.6+pl*.4})`})}}const pulse=(Math.sin(time*5)+1)/2;
    c.strokeStyle='#ffb547';c.lineWidth=3;c.globalAlpha=.5+pulse*.5;c.beginPath();c.arc(dp.x*TS,dp.y*TS,14+pulse*6,0,7);c.stroke();c.globalAlpha=1;
    label(c,destName(),dp.x*TS,dp.y*TS-30,{s:11,c:'#1d2330',bg:'#ffb547'})}
  // 人物
  const ents=NPCS.map(n=>[n,false]).concat([[P,true]]).sort((a,b)=>a[0].y-b[0].y);
  ents.forEach(([n,isP])=>{if(isP){person(c,{x:P.x,y:P.y,fx:P.fx,fy:P.fy,body:'#f6f6f0',hair:'#2a2420'},true);c.fillStyle='#ffb547';c.beginPath();const ay=P.y*TS-26+Math.sin(time*4)*2;c.moveTo(P.x*TS-6,ay-8);c.lineTo(P.x*TS+6,ay-8);c.lineTo(P.x*TS,ay);c.closePath();c.fill()}else person(c,n,false)});
  // 申訴單
  (S&&S.papers||[]).forEach(p=>{c.save();c.translate(p.x*TS,p.y*TS);
    if(p.wait>0){c.strokeStyle='rgba(191,42,30,.8)';c.lineWidth=2;c.beginPath();c.arc(0,0,16+p.wait*10,0,7);c.stroke()}
    c.rotate(p.rot);c.fillStyle='#fffdf5';c.fillRect(-10,-13,20,26);c.strokeStyle='#bf2a1e';c.lineWidth=1.5;c.strokeRect(-10,-13,20,26);
    c.fillStyle='#bf2a1e';c.font='700 8px "Noto Sans TC",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('申訴',0,-4);c.fillRect(-6,4,12,2);c.fillRect(-6,8,9,2);c.restore()});
  c.restore();
  // 畫面外的目的地箭頭
  if(gp){const sx=(gp.x*TS-camX)*zoom,sy=(gp.y*TS-camY)*zoom,m=34;
    if(sx<m||sy<m||sx>cvW-m||sy>cvH-m){const cx0=cvW/2,cy0=cvH/2,ang=Math.atan2(sy-cy0,sx-cx0);
      const ex=clamp(sx,m,cvW-m),ey=clamp(sy,m,cvH-m);c.save();c.translate(ex,ey);c.rotate(ang);c.fillStyle='#ffb547';c.strokeStyle='#1d2330';c.lineWidth=2;
      c.beginPath();c.moveTo(16,0);c.lineTo(-10,-12);c.lineTo(-4,0);c.lineTo(-10,12);c.closePath();c.fill();c.stroke();c.restore()}}
  // 搖桿
  if(joy){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.beginPath();c.arc(joy.ox,joy.oy,42,0,7);c.stroke();
    const jx=clamp(joy.x-joy.ox,-42,42),jy=clamp(joy.y-joy.oy,-42,42);c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(joy.ox+jx,joy.oy+jy,16,0,7);c.fill()}
  // 夜晚
  if(S&&S.night){c.fillStyle='rgba(6,10,22,.9)';c.fillRect(0,0,cvW,cvH);
    const g=(Math.sin(time*3)+1)/2;c.fillStyle=`rgba(143,184,216,${.25+g*.35})`;rr(c,cvW/2-26,cvH*.62-46,52,92,9);c.fill();
    c.fillStyle='rgba(255,255,255,.85)';c.font='700 13px "Noto Sans TC",sans-serif';c.textAlign='center';c.fillText('手機亮了',cvW/2,cvH*.62+66)}
}
function frame(now){
  if(!running)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&!userPaused&&S)update(dt);
  render(now/1000);
  requestAnimationFrame(frame);
}

/* ============ 輸入 ============ */
const KEYMAP={ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',a:'a',d:'d',w:'w',s:'s',A:'a',D:'d',W:'w',S:'s'};
addEventListener('keydown',e=>{
  if($('game').hidden)return;
  if(!$('modal').hidden){const n='1234'.indexOf(e.key);if(n>=0){const b=document.querySelectorAll('#modal .card')[n];if(b&&!b.disabled){e.preventDefault();b.click()}}return}
  if(e.key==='p'||e.key==='Escape'){togglePause();return}
  const k=KEYMAP[e.key];if(k){keys[k]=true;e.preventDefault()}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false});
cv.addEventListener('pointerdown',e=>{if(paused||userPaused)return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,x:e.clientX-r.left,y:e.clientY-r.top}});
cv.addEventListener('pointermove',e=>{if(!joy||joy.id!==e.pointerId)return;const r=cv.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top});
const endJoy=e=>{if(joy&&joy.id===e.pointerId)joy=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
function togglePause(){if(!$('modal').hidden)return;userPaused=!userPaused;$('pauseMsg').hidden=!userPaused;$('pauseBtn').textContent=userPaused?'繼續':'暫停';AU.pause(userPaused);keys={};joy=null}
$('pauseBtn').onclick=togglePause;
$('pauseMsg').onclick=togglePause;
$('sndBtn').onclick=()=>{AU.init();AU.setOn(!AU.on);syncAudioBtns()};
$('voBtn').onclick=()=>{VO.setAuto(!VO.auto);syncAudioBtns()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!userPaused&&$('modal').hidden&&!$('game').hidden)togglePause()});
addEventListener('resize',()=>{if(!$('game').hidden)resize()});

renderStart();
</script>
